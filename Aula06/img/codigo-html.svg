<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-label="Ilustração de código HTML5 na tela de um computador">
  <rect width="400" height="220" rx="12" fill="#1B2A4A"/>
  <rect x="20" y="20" width="360" height="28" rx="6" fill="#0F8B8D"/>
  <circle cx="38" cy="34" r="6" fill="#FF5F56"/>
  <circle cx="56" cy="34" r="6" fill="#FFBD2E"/>
  <circle cx="74" cy="34" r="6" fill="#27C93F"/>
  <text x="200" y="39" font-family="Calibri, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">index.html - Editor de Código</text>
  <rect x="20" y="56" width="360" height="144" rx="6" fill="#0F192E"/>
  <text x="36" y="85" font-family="Consolas, monospace" font-size="15" fill="#F2A541">&lt;!DOCTYPE html&gt;</text>
  <text x="36" y="110" font-family="Consolas, monospace" font-size="15" fill="#4ECDC4">&lt;html lang="pt-BR"&gt;</text>
  <text x="56" y="135" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF">&lt;h1&gt;Olá, Mundo!&lt;/h1&gt;</text>
  <text x="56" y="160" font-family="Consolas, monospace" font-size="15" fill="#A8DADC">&lt;p&gt;Técnico em Informática&lt;/p&gt;</text>
  <text x="36" y="185" font-family="Consolas, monospace" font-size="15" fill="#4ECDC4">&lt;/html&gt;</text>
</svg>
